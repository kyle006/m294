<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=>, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input
      type="button"
      id="myButton"
      value="Click me"
      onclick="alert('you clicked me')"
    />
    <button id="myButton2">also Click me</button>

    <script type="text/JavaScript">
      const myTestfunction2 = () => {
          alert("you clicked me too");
      };
      var button = document.getElementById("myButton2");
      button.onclick = myTestfunction2;
    </script>
  </body>
</html>

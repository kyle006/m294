<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Smiley mit SVG</title>
  </head>

  <body>
    <svg width="400" height="400">
      <circle
        cx="100"
        cy="100"
        r="60"
        stroke="black"
        stroke-width="2"
        fill="yellow"
      />

      <circle
        cx="80"
        cy="80"
        r="10"
        fill="white"
        stroke="black"
        stroke-width="1"
      />

      <circle
        cx="120"
        cy="80"
        r="10"
        fill="white"
        stroke="black"
        stroke-width="1"
      />

      <path
        d="M 80 120 Q 100 140 120 120"
        stroke="black"
        stroke-width="1"
        fill="transparent"
      />
      <!-- Smiley hier beschreiben -->
    </svg>
  </body>
</html>

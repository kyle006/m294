<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Accordion</title>
    <style>
      .accordion > section > main {
        display: none; /*wird nicht angezeigt*/
      }

      .accordion > section.open > main {
        display: block; /*wird angezeigt*/
      }

      .accordion > section > header {
        cursor: pointer;
        display: flex;
        padding: 0.5rem 0;
      }

      .accordion > section > header > h3 {
        padding: 0;
        margin: 0;
        margin-left: 0.25rem;
      }

      .mainOpen {
        display: block; /*Text wird angezeigt*/
      }

      .mainClose {
        display: none; /*Text wird nicht angezeigt*/
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const sections = document.querySelectorAll(".accordion > section");

        sections.forEach((section) => {
          const header = section.querySelector("header");
          const mainText = section.querySelector("main");

          header.addEventListener("click", () => {
            mainText.style.display =
              mainText.style.display === "block" ? "none" : "block";
          });
        });
      });
    </script>
